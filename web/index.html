<style>
/* Layout: full-screen sea with islands; brand + local time top-left, sea chart (minimap) bottom-right, island index bottom-centre, content in a side sheet (bottom sheet on phones) */
:root{
  color-scheme: dark;
  --deep:#0d2229; --panel:#10262e; --raise:#173540; --line:#24434f;
  --fg:#f3efe5; --muted:#a9b8b6; --buoy:#ff8a3d; --buoy-ink:#2a1505; --sand:#f1dcae; --plank:#7a4f2e; --plank2:#8d5d37;
  --f-display:"Gabarito", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --f-hand:"Kalam", "Comic Sans MS", cursive;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--deep);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--buoy);outline-offset:3px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

.brand{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 20px);left:max(22px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.brand > *{pointer-events:auto}
.brand strong{font:900 24px/1 var(--f-display);letter-spacing:-.015em;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.brand .role{font:12px var(--f-mono);color:var(--fg);opacity:.85;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.tod{display:flex;align-items:center;gap:10px;margin-top:4px;font:13px var(--f-body);background:rgba(13,34,41,.62);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 6px 5px 12px;align-self:flex-start;backdrop-filter:blur(6px)}
.tod button{font:600 12px var(--f-body);background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:4px 10px;cursor:pointer}
.tod button:hover{background:rgba(255,255,255,.2)}
.classic-link{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 22px);right:calc(max(22px,env(safe-area-inset-right,0px)) + 112px);font:500 14px var(--f-body);color:var(--fg);background:rgba(13,34,41,.62);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(6px)}

.lang{position:fixed;z-index:13;top:calc(env(safe-area-inset-top,0px) + 22px);right:max(22px,env(safe-area-inset-right,0px));display:flex;gap:2px;padding:3px;background:rgba(13,34,41,.62);border:1px solid rgba(255,255,255,.12);border-radius:999px;backdrop-filter:blur(6px)}
.lang button{font:600 13px var(--f-body);background:none;border:0;border-radius:999px;padding:5px 10px;cursor:pointer;color:var(--fg)}
.lang button:hover{background:rgba(255,255,255,.1)}
.lang button[aria-pressed="true"]{background:var(--buoy);color:var(--buoy-ink)}

nav.index{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:6px;background:rgba(13,34,41,.72);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:5px;backdrop-filter:blur(6px);white-space:nowrap}
nav.index button{font:600 14px var(--f-body);background:none;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--fg)}
nav.index button:hover{background:rgba(255,255,255,.1)}
nav.index button[aria-current="true"]{background:var(--buoy);color:var(--buoy-ink)}

.chart{position:fixed;z-index:5;right:max(22px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:150px;height:150px;border-radius:50%;border:3px solid #e9d7b0;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer;background:#cfe6e2}
.chart-label{position:fixed;z-index:5;right:max(22px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 174px);width:150px;text-align:center;font:700 14px var(--f-hand);color:var(--fg);text-shadow:0 1px 6px rgba(0,0,0,.5)}

.signs[hidden]{display:none}
.sign{position:fixed;left:0;top:0;z-index:3;border:0;padding:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;will-change:transform}
.sign b{display:block;font:700 16px/1.1 var(--f-hand);color:#fbefd8;background:linear-gradient(180deg,var(--plank2),var(--plank));padding:7px 12px 6px;border-radius:3px;box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 -2px 0 rgba(0,0,0,.2);white-space:nowrap}
.sign small{display:block;font:500 11px var(--f-body);color:#f5dfba;opacity:.9;margin-top:1px}
.sign i{display:block;width:4px;height:16px;background:#5c3a20}
.sign:hover b,.sign.hot b{background:linear-gradient(180deg,#a06a3e,#86542f)}

.hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);font:700 16px var(--f-hand);color:var(--fg);text-shadow:0 1px 8px rgba(0,0,0,.6);text-align:center;max-width:calc(100% - 40px)}
.dock-prompt{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);font:700 16px var(--f-body);background:var(--buoy);color:var(--buoy-ink);border:0;border-radius:999px;padding:12px 20px;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;white-space:nowrap}
.dock-prompt kbd{font:600 12px var(--f-mono);background:rgba(42,21,5,.14);border-radius:4px;padding:2px 6px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 22px);transform:translateX(-50%);z-index:9;background:var(--sand);color:#3a2a10;font:700 17px/1.35 var(--f-hand);padding:10px 16px;border-radius:4px;max-width:min(440px,calc(100% - 32px));box-shadow:0 10px 24px rgba(0,0,0,.35);text-align:center}

.panel{position:fixed;z-index:6;top:0;right:0;bottom:0;width:min(460px,100%);box-sizing:border-box;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .55s cubic-bezier(.2,.75,.2,1),visibility 0s .55s;visibility:hidden}
.panel.open{transform:none;visibility:visible;transition:transform .55s cubic-bezier(.2,.75,.2,1)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 18px) max(24px,env(safe-area-inset-right,0px)) 12px 28px}
.panel-body{flex:1;overflow-y:auto;padding:8px max(28px,env(safe-area-inset-right,0px)) 32px 28px;display:flex;flex-direction:column;gap:18px}
.panel-foot{display:flex;justify-content:space-between;gap:10px;padding:14px max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) 28px;border-top:1px solid var(--line)}
.panel-foot button{font:500 14px var(--f-body);background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 0}
.panel-foot button:hover{color:var(--fg)}
.leave{font:600 14px var(--f-body);background:var(--raise);border:0;border-radius:8px;color:var(--fg);cursor:pointer;padding:8px 14px}
.leave:hover{background:#1e4250}
.where{font:15px var(--f-hand);color:var(--muted)}

.content .kicker{font:700 19px var(--f-hand);color:var(--buoy);display:inline-block;transform:rotate(-1.5deg);transform-origin:left}
.content h2{margin:-6px 0 0;font:900 clamp(30px,3.4vw,40px)/1.02 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.content h3{margin:0;font:700 20px/1.2 var(--f-display)}
.content p{margin:0;line-height:1.62;font-size:16.5px;max-width:62ch}
.content .lead{font-size:19px;line-height:1.5}
.muted{color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;margin:6px 0 0}
.facts div{display:flex;flex-direction:column;gap:3px;min-width:0}
.facts dt{font:11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font:600 16px var(--f-body)}
.proj{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:8px}
.metric{font:900 32px/1 var(--f-display);color:var(--sand);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric small{display:block;font:400 14px/1.4 var(--f-body);color:var(--muted);letter-spacing:0;margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font:12px var(--f-mono);background:var(--raise);padding:3px 8px;border-radius:3px;color:#d3dedb}
.lnk{font:600 15px var(--f-body);color:#8fdcf0;text-decoration:none;align-self:flex-start}
.lnk:hover{text-decoration:underline}
.tl{list-style:none;margin:6px 0 0 6px;padding:0;border-left:2px dotted #3b5f6b;display:flex;flex-direction:column;gap:24px}
.tl > li{padding-left:22px;position:relative;display:flex;flex-direction:column;gap:4px}
.tl > li::before{content:"";position:absolute;left:-8px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--buoy)}
.tl > li.next::before{background:var(--panel);border:2px dashed var(--buoy);width:10px;height:10px}
.when{font:12px var(--f-mono);color:var(--muted)}
.tl ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;color:#d3dedb;font-size:15px;line-height:1.5}
.hand{font:700 22px var(--f-hand);color:var(--buoy)}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;border-top:1px solid var(--line);padding:14px 0}
.skill strong{font:700 19px var(--f-display)}
.skill .d{grid-column:1 / -1;color:var(--muted);font-size:15px}
.meter{display:flex;gap:3px;align-items:center}
.meter i{width:10px;height:10px;border-radius:2px;background:#24434f}
.meter i.on{background:var(--buoy)}
.meter span{font:12px var(--f-mono);color:var(--muted);margin-left:8px;font-variant-numeric:tabular-nums}
.mail{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--raise);border-radius:8px;padding:14px 16px}
.mail code{font:15px var(--f-mono);user-select:all;word-break:break-all;flex:1;min-width:0}
.btn{font:600 15px var(--f-body);padding:11px 18px;border-radius:8px;border:0;background:var(--raise);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--buoy);color:var(--buoy-ink)}
.btn:hover{filter:brightness(1.08)}
.row{display:flex;gap:10px;flex-wrap:wrap}

.intro{position:fixed;inset:0;z-index:10;display:flex;align-items:center;background:linear-gradient(90deg,rgba(8,22,27,.9) 0%,rgba(8,22,27,.62) 40%,rgba(8,22,27,0) 72%);padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));transition:opacity .9s}
.intro.out{opacity:0;pointer-events:none}
.intro-in{max-width:520px;display:flex;flex-direction:column;gap:20px;align-items:flex-start;margin-left:clamp(0px,5vw,72px)}
.intro .kicker{font:700 21px var(--f-hand);color:var(--buoy);transform:rotate(-2deg);display:inline-block}
.intro h1{margin:-8px 0 0;font:900 clamp(52px,8vw,104px)/.9 var(--f-display);letter-spacing:-.035em}
.intro p{margin:0;font-size:clamp(17px,1.8vw,20px);line-height:1.55;color:#dfe8e5;max-width:40ch}
.intro .small{font:12px var(--f-mono);color:var(--muted)}
.textbtn{font:500 15px var(--f-body);background:none;border:0;border-bottom:1px solid #4b6b74;color:var(--muted);cursor:pointer;padding:2px 0}
.textbtn:hover{color:var(--fg)}

.classic-view{position:fixed;inset:0;z-index:12;background:var(--deep);overflow-y:auto}
.classic-in{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 32px) max(20px,env(safe-area-inset-right,0px)) 72px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.classic-in section{display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line);padding-top:30px}
.classic-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.classic-top strong{font:900 24px var(--f-display)}

@media (max-width:760px){
  .brand strong{font-size:20px}
  .tod{font-size:12px}
  .tod span{max-width:150px}
  nav.index{left:0;right:0;transform:none;border-radius:0;border-left:0;border-right:0;bottom:0;padding:6px max(10px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 6px);overflow-x:auto;scrollbar-width:none}
  nav.index::-webkit-scrollbar{display:none}
  .chart{width:84px;height:84px;top:calc(env(safe-area-inset-top,0px) + 126px);bottom:auto;border-width:2px}
  .chart-label{display:none}
  .hint{bottom:calc(env(safe-area-inset-bottom,0px) + 70px);font-size:15px}
  .dock-prompt{bottom:calc(env(safe-area-inset-bottom,0px) + 72px)}
  .dock-prompt kbd{display:none}
  .panel{top:auto;left:0;width:auto;height:62%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(102%)}
  .panel-head{padding-top:14px}
  body.panel-open nav.index,body.panel-open .hint,body.panel-open .dock-prompt{display:none}
  .sign b{font-size:13px;padding:5px 9px 4px}
  .sign small{display:none}
  .intro{background:linear-gradient(0deg,rgba(8,22,27,.95) 0%,rgba(8,22,27,.72) 55%,rgba(8,22,27,.15) 100%);align-items:flex-end}
  .intro-in{margin:0 0 5vh}
  .classic-top{padding-right:96px}
}
@media (min-width:761px){.panel-head{padding-right:124px}}
@media (prefers-reduced-motion:reduce){.panel,.panel.open,.intro{transition:none}}

    panel.classList.add('open'); panel.setAttribute('aria-hidden','false'); document.body.classList.add('panel-open'); setOffset(true);
    setTimeout(()=>$('#leaveBtn').focus({preventScroll:true}),80);
  }
  function closePanel(){ panelId=null; panel.classList.remove('open'); panel.setAttribute('aria-hidden','true'); document.body.classList.remove('panel-open'); setOffset(false); }
  $('#leaveBtn').addEventListener('click',()=>leave());

  // ---------- camera ----------
  const camT=V(0,0,0), camP=V(0,60,70); let camMode='intro', camIsland=null;
  let off={x:0,y:0}, offT={x:0,y:0};
  const portrait=()=>innerWidth/innerHeight<1;
  function setCam(m,id){ camMode=m; camIsland=id||null; }
  function setOffset(on){ offT=!on?{x:0,y:0}:innerWidth>760?{x:Math.min(460,innerWidth)/2,y:0}:{x:0,y:innerHeight*.62/2}; }
  function camGoal(){
    if(camMode==='island'&&camIsland){ const c=IS[camIsland]; const cx=c.cx??c.x, cz=c.cz??c.z; const k=portrait()?1.7:1; const d=camIsland==='exp'?1.6:1;
      return {t:V(cx,1.6,cz),p:V(cx+3*k,1.6+12*k*d,cz+15*k*d)}; }
    if(camMode==='intro') return {t:V(0,0,-6),p:V(10,55,58)};
    const k=portrait()?1.65:1; const lead=V(Math.sin(B.h),0,Math.cos(B.h)).multiplyScalar(Math.min(Math.abs(B.v),9)*.35*Math.sign(B.v||1));
    return {t:V(B.x+lead.x,0,B.z+lead.z),p:V(B.x+lead.x+2*k,20*k,B.z+lead.z+19*k)};
  }

  // ---------- input ----------
  const cv=$('#gl'), ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
  const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
  addEventListener('keydown',e=>{
    if(e.key==='Escape'){ if(!$('#classic').hidden) classic(false); else if(mode==='ashore') leave(); return; }
    if((e.code==='Space'||e.code==='KeyE'||e.code==='Enter')&&nearDock&&mode==='sail'&&!e.target.closest('button,a,input,textarea')){ e.preventDefault(); dock(nearDock); return; }
    const k=KEYMAP[e.code]; if(!k||mode==='intro'||e.target.closest('input,textarea')) return;
    if(mode==='docking'||mode==='boarding'||mode==='undocking'){ e.preventDefault(); return; }
    if(e.target.closest('.panel')&&mode==='ashore') return;
    e.preventDefault(); keys[k]=true; auto=null; if(mode==='ashore') leave();
  });
  addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k) keys[k]=false; });
  addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
  let down=null, hovered=null;
  const waterPlane=new THREE.Plane(V(0,1,0),0);
  function pick(x,y){ ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1); ray.setFromCamera(ndc,camera); const h=ray.intersectObjects(hot,false)[0]; return h?h.object.userData.hot:null; }
  cv.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY}; });
  cv.addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse'||mode==='intro') return; const h=pick(e.clientX,e.clientY); if(h!==hovered){ hovered=h; cv.style.cursor=h&&IS[h]?'pointer':'crosshair'; ORDER.forEach(id=>IS[id].el.classList.toggle('hot',id===h)); } });
  cv.addEventListener('pointerup',e=>{
    if(!down||mode==='intro') return; const mv=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null; if(mv>10) return;
    const h=pick(e.clientX,e.clientY);
    if(h&&IS[h]) return go(h);
    if(h==='gull') return toast(tr('gull'));
    if(h==='boat') return toast(tr('boat'));
    if(mode==='ashore') return leave();
    if(mode!=='sail') return;
    ray.setFromCamera(ndc,camera); const p=new THREE.Vector3(); if(ray.ray.intersectPlane(waterPlane,p)){ auto={x:p.x,z:p.z}; spawnPing(p.x,p.z); }
  });
  document.addEventListener('click',e=>{ const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; } const c=e.target.closest('[data-copy]'); if(c) copy($('#'+c.dataset.copy),c); });
  const ping=add(new THREE.RingGeometry(.5,.75,28).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}),0,.2,0,scene,false); let pingT=0;
  function spawnPing(x,z){ ping.position.set(x,.2,z); pingT=performance.now(); }

  // sea chart
  const chart=$('#chart'), cg=chart.getContext('2d'), R=46;
  function chartXY(x,z){ return [(x/R+1)*150,(z/R+1)*150]; }
  function drawChart(){
    cg.clearRect(0,0,300,300); cg.fillStyle='#bfe0dc'; cg.beginPath(); cg.arc(150,150,150,0,Math.PI*2); cg.fill();
    cg.strokeStyle='rgba(30,80,90,.18)'; cg.lineWidth=1; for(let r=40;r<150;r+=40){ cg.beginPath(); cg.arc(150,150,r,0,Math.PI*2); cg.stroke(); }
    cg.setLineDash([6,6]); cg.strokeStyle='rgba(120,70,30,.5)'; cg.lineWidth=2; cg.beginPath(); ORDER.forEach((id,i)=>{ const p=dockPose(id), [x,y]=chartXY(p.x,p.z); i?cg.lineTo(x,y):cg.moveTo(x,y); }); cg.closePath(); cg.stroke(); cg.setLineDash([]);
    colliders.forEach(c=>{ const [x,y]=chartXY(c.x,c.z); cg.fillStyle='#e8d09a'; cg.beginPath(); cg.arc(x,y,c.r/R*150*1.05,0,Math.PI*2); cg.fill(); cg.fillStyle='#7fb069'; cg.beginPath(); cg.arc(x,y,c.r/R*150*.75,0,Math.PI*2); cg.fill(); });
    cg.font='700 22px "Kalam", cursive'; cg.fillStyle='#3a2a10'; cg.textAlign='center';
    ORDER.forEach(id=>{ const c=IS[id], [x,y]=chartXY(c.cx??c.x,c.cz??c.z); cg.fillText(isl(id).label,x,y-c.r/R*150-6); });
    const [bx,by]=chartXY(B.x,B.z); cg.save(); cg.translate(bx,by); cg.rotate(-B.h+Math.PI); cg.fillStyle='#ff8a3d'; cg.strokeStyle='#2a1505'; cg.lineWidth=3; cg.beginPath(); cg.moveTo(0,-14); cg.lineTo(9,10); cg.lineTo(-9,10); cg.closePath(); cg.fill(); cg.stroke(); cg.restore();
  }
  chart.addEventListener('click',e=>{
    const r=chart.getBoundingClientRect(), x=((e.clientX-r.left)/r.width*2-1)*R, z=((e.clientY-r.top)/r.height*2-1)*R;
    let best=null, bd=1e9; ORDER.forEach(id=>{ const c=IS[id], d=Math.hypot(x-(c.cx??c.x),z-(c.cz??c.z)); if(d<bd){ bd=d; best=id; } });
    if(bd<9) go(best); else if(mode==='sail'){ auto={x,z}; spawnPing(x,z); } else if(mode==='ashore') leave(()=>{ auto={x,z}; });
  });

  function enter(){
    if(mode!=='intro') return; mode='sail'; setCam('follow');
    $('#intro').classList.add('out'); setTimeout(()=>$('#intro').hidden=true,900);
    setTimeout(()=>{ if(mode==='sail'){ signsEl.hidden=false; const h=$('#hint'); h.textContent=hintText(); h.hidden=false; setTimeout(()=>h.hidden=true,10000); } },1400);
  }
  $('#enterBtn').addEventListener('click',enter);

  // ---------- resize ----------
  function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.fov=portrait()?48:36; camera.updateProjectionMatrix(); if(mode==='ashore') setOffset(true); }
  addEventListener('resize',resize); resize();

  // ---------- loop ----------
  const ACC=7, DRAG=.9, TURN=1.6, MAXV=9;
  let last=performance.now(), lastChart=0;
  const angDiff=(a,b)=>{ let d=b-a; while(d>Math.PI) d-=Math.PI*2; while(d<-Math.PI) d+=Math.PI*2; return d; };
  function physics(dt,now){
    let thr=(keys.up?1:0)-(keys.down?1:0), str=(keys.left?1:0)-(keys.right?1:0);
    if(auto&&mode==='sail'){
      const dx=auto.x-B.x, dz=auto.z-B.z, dist=Math.hypot(dx,dz); let want=Math.atan2(dx,dz);
      for(const c of colliders){ if(auto.dock&&c.id===auto.dock&&c.r===IS[auto.dock].r) continue; const ox=c.x-B.x, oz=c.z-B.z, od=Math.hypot(ox,oz)-c.r*1.2;
        if(od<5&&od<dist){ const ang=Math.atan2(ox,oz), rel=angDiff(B.h,ang); if(Math.abs(rel)<1.1){ want+= (rel>0?-1:1)*(1.2-Math.abs(rel))*1.2; } } }
      const ad=angDiff(B.h,want); str=Math.max(-1,Math.min(1,ad*2.2)); thr=Math.abs(ad)>1.3?.25:Math.min(1,dist/5);
      if(auto.dock&&dist<2.6){ dock(auto.dock); return; }
      if(!auto.dock&&dist<1.2){ auto=null; }
    }
    B.v+=thr*ACC*dt; B.v-=B.v*DRAG*dt; B.v=Math.max(-3,Math.min(MAXV,B.v));
    B.h+=str*TURN*dt*Math.min(1,.35+Math.abs(B.v)/5)*(B.v<-.1?-1:1);
    B.x+=Math.sin(B.h)*B.v*dt; B.z+=Math.cos(B.h)*B.v*dt;
    for(const c of colliders){ const dx=B.x-c.x, dz=B.z-c.z, d=Math.hypot(dx,dz), min=c.r*1.12+1.0; if(d<min){ B.x=c.x+dx/d*min; B.z=c.z+dz/d*min; B.v*=.6; } }
    const dO=Math.hypot(B.x,B.z); if(dO>44){ B.x*=44/dO; B.z*=44/dO; B.v*=.6; }
    if(dockCool){ const p=dockPose(dockCool); if(Math.hypot(B.x-p.x,B.z-p.z)>8) dockCool=null; }
    let near=null; if(!auto) for(const id of ORDER){ if(id===dockCool) continue; const p=dockPose(id); if(Math.hypot(B.x-p.x,B.z-p.z)<3.6){ near=id; break; } }
    setNear(near);
  }
  const tmp=V(0,0,0);
  function frame(now){
    requestAnimationFrame(frame); if(document.hidden){ last=now; return; }
    const dt=Math.min(window.__dtMax||.05,(now-last)/1000); last=now; const t=now/1000;
    if(Math.abs(angDiff(curHour/24*Math.PI*2,targetHour/24*Math.PI*2))>.002){ let d=targetHour-curHour; if(d>12) d-=24; if(d<-12) d+=24; curHour=(curHour+d*Math.min(1,dt*2.2)+24)%24; applyTime(curHour); }
    updateWater(t);
    if(mode==='sail') physics(dt,now); else if(nearDock) setNear(null);
    if(dockAnim){ const k=Math.min(1,(now-dockAnim.t0)/dockAnim.dur), e=k*k*(3-2*k); B.x=dockAnim.from.x+(dockAnim.to.x-dockAnim.from.x)*e; B.z=dockAnim.from.z+(dockAnim.to.z-dockAnim.from.z)*e; B.h=dockAnim.from.h+angDiff(dockAnim.from.h,dockAnim.to.h)*e; if(k>=1){ const th=dockAnim.then; dockAnim=null; th(); } }
    const by=waveY(B.x,B.z,t)-.05; boat.position.set(B.x,by-.12,B.z); boat.rotation.set(Math.sin(t*1.6)*.03,B.h,Math.cos(t*1.3)*.04+(mode==='sail'?-(keys.left?1:0)+(keys.right?1:0):0)*.06*Math.min(1,Math.abs(B.v)/4));
    // walking
    let walking=false;
    if(walk){ const tgt=walk.pts[walk.i]; tmp.copy(tgt).sub(me.position); const d=tmp.length(), step=1.8*dt;
      if(d<=step){ me.position.copy(tgt); walk.i++; if(walk.i>=walk.pts.length){ const f=walk.onDone; walk=null; f&&f(); } }
      else { tmp.multiplyScalar(step/d); me.position.add(tmp); me.rotation.y=Math.atan2(tgt.x-me.position.x,tgt.z-me.position.z); walking=true; } }
    const sw=walking?Math.sin(t*12)*.6:(mode==='sail'&&Math.abs(B.v)>.5?0:0);
    legL.rotation.x=sw; legR.rotation.x=-sw; armL.rotation.x=-sw*.8; armR.rotation.x=sw*.8;
    if(!walking&&mode==='ashore'){ armR.rotation.z=Math.sin(t*6)*.3+(Math.floor(t)%6===0?1.2:0); } else armR.rotation.z=0;
    // wake
    if(mode==='sail'&&Math.abs(B.v)>1&&now-lastWake>90){ lastWake=now; const w=wakes[wakeIdx++%wakes.length]; w.position.set(B.x-Math.sin(B.h)*1.3,.12,B.z-Math.cos(B.h)*1.3); w.userData.life=1; w.scale.setScalar(.6); }
    wakes.forEach(w=>{ if(w.userData.life>0){ w.userData.life-=dt*.6; w.scale.multiplyScalar(1+dt*1.2); w.material.opacity=Math.max(0,w.userData.life*.55); } });
    // life
    foams.forEach(f=>f.material.opacity=.22+Math.sin(t*1.4+f.userData.phase)*.1);
    gulls.forEach(g=>{ const u=g.userData, a=t*u.sp+u.ph; g.position.set(u.cx+Math.cos(a)*u.r,u.h+Math.sin(a*2)*.4,u.cz+Math.sin(a)*u.r); g.rotation.y=-a; const f=Math.sin(t*8+u.ph)*.5; u.wl.rotation.z=f; u.wr.rotation.z=-f; });
    const ch=islands.about.localToWorld(islands.about.userData.chimney.clone());
    smoke.forEach(s=>{ s.userData.t=(s.userData.t+dt*.18)%1; const k=s.userData.t; s.position.set(ch.x+Math.sin(k*6+t)*.2,ch.y+k*2.4,ch.z-k*.6); s.scale.setScalar(.6+k*1.4); s.material.opacity=.55*(1-k); });
    beam.rotation.y=t*.8; beam.userData.m.opacity=env.lights*.1;
    radioLed.material.color.set((t%1.4)<.7?0xff4a3a:0x551a14);
    bottle.position.y=.6+Math.sin(t*2)*.03; bottle.rotation.x=Math.sin(t*1.5)*.15;
    flags.forEach((f,i)=>{ f.rotation.y=Math.sin(t*2+i)*.15; });
    if(pingT){ const k=(now-pingT)/700; if(k>1){ pingT=0; ping.material.opacity=0; } else { ping.scale.setScalar(1+k*1.5); ping.material.opacity=(1-k)*.8; } }
    // camera
    const goal=camGoal(), lk=camMode==='intro'?.02:.05;
    camT.lerp(goal.t,lk); camP.lerp(goal.p,lk*.9); camera.position.copy(camP); camera.lookAt(camT);
    off.x+=(offT.x-off.x)*.08; off.y+=(offT.y-off.y)*.08;
    if(Math.abs(off.x)>.5||Math.abs(off.y)>.5) camera.setViewOffset(innerWidth,innerHeight,off.x,off.y,innerWidth,innerHeight); else if(camera.view&&camera.view.enabled) camera.clearViewOffset();
    // sun follows view
    const sd=V(Math.cos(env.az)*Math.cos(env.el),Math.sin(env.el),Math.sin(env.az)*Math.cos(env.el));
    sun.target.position.copy(camT); sun.position.copy(camT).addScaledVector(sd,60);
    renderer.render(scene,camera);
    // signs
    if(!signsEl.hidden) ORDER.forEach(id=>{ const c=IS[id]; tmp.set(c.cx??c.x,c.signY,c.cz??c.z).project(camera); const el=IS[id].el, vis=tmp.z<1&&Math.abs(tmp.x)<1.1&&Math.abs(tmp.y)<1.1;
      el.style.visibility=vis?'visible':'hidden'; if(vis) el.style.transform=`translate(${((tmp.x+1)/2*innerWidth).toFixed(1)}px,${((1-tmp.y)/2*innerHeight).toFixed(1)}px) translate(-50%,-100%)`; });
    if(now-lastChart>100){ lastChart=now; drawChart(); }
  }
  LANG_HOOKS.push(()=>{ todLabel(); if(nearDock) promptEl.innerHTML=promptHTML(nearDock); if(panelId) fillPanel(panelId,true);
    flags.forEach(f=>{ f.material.map.dispose(); f.material.map=f.userData.mk(); f.material.needsUpdate=true; });
    const h=$('#hint'); if(!h.hidden) h.textContent=hintText(); });
  requestAnimationFrame(frame);
  $('#enterBtn').disabled=false; enterState='ready'; applyEnter();
  window.__isl={go,enter,leave,setHour:h=>{ PRESETS[1]=h; presetIdx=1; targetHour=curHour=h; applyTime(h); todLabel(); },state:()=>({mode,at,B:{...B}})};
}
</script>

</body>
